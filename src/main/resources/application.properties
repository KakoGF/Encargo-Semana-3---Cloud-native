spring.application.name=guias-despacho
server.port=8080

# Ruta donde se monta el EFS dentro del contenedor (ver pipeline: -v /mnt/efs:/app/efs)
# En local puedes sobreescribirla con la variable de entorno EFS_PATH
app.efs.path=${EFS_PATH:/app/efs}

# Bucket de S3 por defecto (se inyecta por variable de entorno en el despliegue)
aws.s3.bucket=${S3_BUCKET:guias-despacho-bucket}

# Limites de subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs AWS
logging.level.software.amazon.awssdk=INFO
logging.level.io.awspring.cloud=INFO
